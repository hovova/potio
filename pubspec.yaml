name: potio
description: "Interactive mixology learning app with a drinks encyclopedia, recipe quizzes, campaigns, achievements, and bartender education."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  audioplayers: ^6.7.1

  # Monetisation - planned for Premium / No Ads
  google_mobile_ads: ^8.0.0
  in_app_purchase: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/drinks/
    - assets/ingredients/
    - assets/audio/
    - assets/app_icon/
